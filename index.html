<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería La Confianza S.A</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Contenedor dinámico donde se intercambiarán las vistas -->
  <div id="app-content">

    <header class="header-banner">
      <h1>PANADERIA LA CONFIANZA S.A 🇳🇮</h1>
    </header>

   <!-- Sección de Vendedores -->
    <section class="vendedores-grid">
      <button class="btn-circulo btn-vendedor" data-vendedor="MARTA" onclick="abrirPedido('MARTA')">MARTA</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="ISABEL V" onclick="abrirPedido('ISABEL V')">ISABEL V</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="ANTONIA" onclick="abrirPedido('ANTONIA')">ANTONIA</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="MIGUEL" onclick="abrirPedido('MIGUEL')">MIGUEL</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="ALEJANDRO" onclick="abrirPedido('ALEJANDRO')">ALEJANDRO</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="MARCOS" onclick="abrirPedido('MARCOS')">MARCOS</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="CHOMBO" onclick="abrirPedido('CHOMBO')">CHOMBO</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="RAFAELA" onclick="abrirPedido('RAFAELA')">RAFAELA</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="ALBERTH" onclick="abrirPedido('ALBERTH')">ALBERTH</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="KARLA" onclick="abrirPedido('KARLA')">KARLA</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="ISABEL L" onclick="abrirPedido('ISABEL L')">ISABEL L</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="MEDINA" onclick="abrirPedido('MEDINA')">MEDINA</button>
      <button class="btn-circulo btn-vendedor" data-vendedor="ENGEL" onclick="abrirPedido('ENGEL')">ENGEL</button>
    </section>

    <!-- Línea divisoria y Módulos Principales -->
    <div style="margin-top: 35px; padding-top: 25px; border-top: 2px dashed #e6d2b5;">
      <h3 style="margin-bottom: 18px; color: #3b2314; font-size: 1.15rem; font-weight: 700;">Módulos del Sistema</h3>
      
      <section class="acciones-grid">
        <button class="btn-circulo btn-accion" style="background-color: #8b5cf6; color: white;" onclick="abrirVentaLocal()">VENTA LOCAL</button>
        <button class="btn-circulo btn-accion" style="background-color: #faa200; color: white;" onclick="abrirFormularioGasto()">GASTOS</button>
        <button class="btn-circulo btn-accion" style="background-color: #d99f3a; color: white;" onclick="abrirModulo('PEDIDO')">PEDIDO</button>
        <button class="btn-circulo btn-accion" style="background-color: #a55d22; color: white;" onclick="abrirArqueoGeneral()">ARQUEO</button>
        <button class="btn-circulo btn-accion" style="background-color: #3b2314; color: white;" onclick="abrirModulo('PLANILLA')">PLANILLA</button>
      </section>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
