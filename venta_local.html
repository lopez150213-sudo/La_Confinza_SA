<div class="pedido-container">
  
  <div class="vendedor-header" style="display: flex; justify-content: space-between; align-items: center;">
    <h2>VENTA LOCAL RÁPIDA</h2>
    <button class="btn-circulo btn-inicio" onclick="volverInicio()" style="width: auto; padding: 10px 20px;">INICIO</button>
  </div>

  <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-top: 15px;">
    
    <!-- COLUMNA IZQUIERDA: Botones de Productos -->
    <div class="card" style="padding: 15px; background: #fff; border-radius: 12px; border: 1px solid var(--border-color);">
      <h3 style="margin-top: 0; color: #3b2314; font-size: 1.1rem; margin-bottom: 15px;">Seleccione Productos</h3>
      <div id="grid-productos-local" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-height: 60vh; overflow-y: auto; padding-right: 5px;">
        <!-- Se cargan dinámicamente -->
      </div>
    </div>

    <!-- COLUMNA DERECHA: Ticket / Carrito Actual -->
    <div class="card" style="padding: 15px; background: #fff; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <h3 style="margin-top: 0; color: #3b2314; font-size: 1.1rem; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px;">Ticket de Venta</h3>
        
        <div style="max-height: 40vh; overflow-y: auto; margin-top: 10px;">
          <table style="width: 100%; border-collapse: collapse;" id="tabla-carrito-local">
            <thead>
              <tr style="font-size: 0.85rem; color: #64748b; border-bottom: 1px solid #cbd5e1;">
                <th style="text-align: left; padding: 4px;">PRODUCTO</th>
                <th style="text-align: center; padding: 4px;">CANT.</th>
                <th style="text-align: right; padding: 4px;">SUBTOTAL</th>
                <th style="text-align: center; padding: 4px;"></th>
              </tr>
            </thead>
            <tbody id="tbody-carrito-local">
              <tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 20px;">El carrito está vacío</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Totales y Botón de Cobro -->
      <div style="border-top: 2px solid #cbd5e1; padding-top: 15px; margin-top: 15px;">
        <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; color: #3b2314; margin-bottom: 15px;">
          <span>TOTAL A PAGAR:</span>
          <span id="total-venta-local" style="color: #d97706;">C$0.00</span>
        </div>
        
        <button type="button" class="btn-modal btn-modal-confirm" style="width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 8px;" onclick="cobrarVentaLocal()">
          💰 Cobrar y Registrar Venta
        </button>
      </div>
    </div>

  </div>
</div>
